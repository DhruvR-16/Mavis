<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavis Live - Select Workout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-main)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5l11 11"/>
                    <path d="M21 21l-1-1"/>
                    <path d="M3 3l1 1"/>
                    <path d="M18 22l4-4"/>
                    <path d="M2 6l4-4"/>
                    <path d="M3 10l7-7"/>
                    <path d="M14 21l7-7"/>
                </svg>
                Mavis
            </div>
            <div class="nav-links">
                <a href="#" class="active">Dashboard</a>
                <a href="monitor.html?type=bicep">Quick Start</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 2rem;">
            
            <header style="text-align: center; margin-bottom: 3rem;">
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-main);">Select your workout</h1>
                <p style="color: var(--text-muted);">Choose a guided AI tracking session to begin.</p>
            </header>

            <div class="selection-grid" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; max-width: 800px; width: 100%;">
                
                <a href="monitor.html?type=bicep" class="card" style="flex: 1; min-width: 300px; background: var(--bg-card); padding: 3rem 2rem; border-radius: 12px; text-decoration: none; color: var(--text-main); text-align: center; border: 2px solid var(--border-color); transition: all 0.2s;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">💪</div>
                    <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--accent-main); text-transform: uppercase;">Bicep Curls</h2>
                    <p style="color: var(--text-muted);">Form & Rep Tracking</p>
                </a>

                <a href="monitor.html?type=shoulder" class="card" style="flex: 1; min-width: 300px; background: var(--bg-card); padding: 3rem 2rem; border-radius: 12px; text-decoration: none; color: var(--text-main); text-align: center; border: 2px solid var(--border-color); transition: all 0.2s;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">🏋️</div>
                    <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--accent-main); text-transform: uppercase;">Shoulder Press</h2>
                    <p style="color: var(--text-muted);">Stability & ROM Check</p>
                </a>

            </div>

            <footer style="margin-top: 4rem; color: var(--text-muted); font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                <div>Powered by MediaPipe Pose & TensorFlow</div>
                <a href="https://github.com/DhruvR-16/Mavis" target="_blank" rel="noopener noreferrer" style="color: #E2FF00; text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    View Source Code
                </a>
            </footer>

        </main>
    </div>

    <!-- Hover styles injection to keep it clean without massive style.css changes right now -->
    <style>
        .card:hover {
            border-color: var(--accent-main) !important;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(226, 255, 0, 0.1);
        }
    </style>
</body>
</html>
